name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: pyright

      - name: Test
        run: pytest --cov=pysrmkit --cov-report=term-missing


  postgresql:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: pysrmkit_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pysrmkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYSRMKIT_POSTGRESQL_TEST_URL: postgresql+psycopg://postgres@localhost:5432/pysrmkit_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PostgreSQL test dependencies
        run: python -m pip install -e ".[dev,postgresql]"

      - name: PostgreSQL repository contracts
        run: pytest -m postgresql


  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYSRMKIT_DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/pysrmkit
      POSTGRES_URL: postgres://postgres@localhost:5432/next_dashboard
      PYSRMKIT_API_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout PySRMKit
        uses: actions/checkout@v4
        with:
          path: pysrmkit

      - name: Checkout Next.js Dashboard
        uses: actions/checkout@v4
        with:
          repository: tawounfouet/nextjs-acme-dashboard
          path: resources/nextjs-acme-dashboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: resources/nextjs-acme-dashboard/package-lock.json

      - name: Install Python dependencies
        run: |
          cd pysrmkit
          python -m pip install -e ".[dev,api,postgresql,migrations]"
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Install Node dependencies and build dashboard
        run: |
          cd resources/nextjs-acme-dashboard
          npm ci
          npm run build

      - name: Bootstrap integration databases, migrations and seeds
        run: |
          cd pysrmkit
          python -m examples.bootstrap_integration

      - name: Run Integration Qualification and E2E browser tests
        run: |
          cd pysrmkit
          pytest tests/test_http_api_example.py tests/test_seed_suppliers_example.py tests/test_bootstrap_integration.py tests/test_browser_journey.py
